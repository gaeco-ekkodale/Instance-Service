services:
  instance-postgres:
    image: postgres:14
    environment:
      POSTGRES_PASSWORD: ${INSTANCE_POSTGRES_PASSWORD}
      POSTGRES_USER: ${INSTANCE_POSTGRES_USER}
      POSTGRES_DB: ${INSTANCE_POSTGRES_DATABASE}
    expose:
      - 5432
    volumes:
      # Long "type: bind" form so `docker compose config --no-path-resolution` keeps
      # the ${VOLUME_BASE_PATH} source intact (short form gets mis-typed as a volume).
      - type: bind
        source: ${VOLUME_BASE_PATH}/instance/postgres/
        target: /var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test:
        [
          "CMD",
          "pg_isready",
          "-q",
          "-h",
          "127.0.0.1",
          "-d",
          "${INSTANCE_POSTGRES_DATABASE}",
          "-U",
          "${INSTANCE_POSTGRES_USER}",
        ]
      interval: 10s
      timeout: 5s
      retries: 50
      start_period: 30s

  instance-arcadedb:
    image: arcadedata/arcadedb:26.3.1
    user: "0:0"
    expose:
      - 2480
      - 2424
      - 8182
    volumes:
      # Long "type: bind" form so `docker compose config --no-path-resolution` keeps
      # the ${VOLUME_BASE_PATH} source intact (short form gets mis-typed as a volume).
      - type: bind
        source: ${VOLUME_BASE_PATH}/instance/arcadedb/databases
        target: /home/arcadedb/databases
    environment:
      - "JAVA_OPTS=-Darcadedb.server.rootPassword=${INSTANCE_ARCADEDB_PASSWORD} -Darcadedb.server.plugins=GremlinServer:com.arcadedb.server.gremlin.GremlinServerPlugin -Darcadedb.server.defaultDatabases=${INSTANCE_ARCADEDB_DATABASE}[${INSTANCE_ARCADEDB_USER}:${INSTANCE_ARCADEDB_PASSWORD}:admin]"
    networks:
      - internal
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:2480/api/v1/ready || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 50

  instance-server:
    image: ${IMAGE_BASE_PATH}/instance-server:${INSTANCE_SERVER_TAG}
    expose:
      - 80
    depends_on:
      instance-arcadedb:
        condition: service_healthy
      instance-postgres:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - Gremlin__Hostname=instance-arcadedb
      - Gremlin__Port=8182
      - Gremlin__Database=${INSTANCE_ARCADEDB_DATABASE}
      - Gremlin__User=${INSTANCE_ARCADEDB_USER}
      - Gremlin__Password=${INSTANCE_ARCADEDB_PASSWORD}
      - Gremlin__EnableSSL=false
      - Access__Address=http://access-server:80
      - UseCase__Address=http://usecase-server:80
      - Postgres__Host=instance-postgres
      - Postgres__Port=5432
      - Postgres__User=${INSTANCE_POSTGRES_USER}
      - Postgres__Password=${INSTANCE_POSTGRES_PASSWORD}
      - Postgres__Database=${INSTANCE_POSTGRES_DATABASE}
      # Broker-level settings shared by all consumers
      - Kafka__Address=${KAFKA_ADDRESS}
      - Kafka__AutoOffsetReset=${KAFKA_AUTO_OFFSET_RESET}
      - Kafka__SessionTimeoutMs=${KAFKA_SESSION_TIMEOUT_MS}
      - Kafka__MaxPollIntervalMs=${KAFKA_MAX_POLL_INTERVAL_MS}
      - Kafka__MessageMaxBytes=${KAFKA_MESSAGE_MAX_BYTES}
      # Per-consumer settings (one consumer group + topic/pattern each)
      - Kafka__Consumers__GraphDataModel__ConsumerGroup=${KAFKA_CONSUMER_GROUP_GRAPHDATAMODEL}
      - Kafka__Consumers__GraphDataModel__TopicPattern=${KAFKA_TOPIC_PATTERN}
      - Kafka__Consumers__Guidelines__ConsumerGroup=${KAFKA_CONSUMER_GROUP_GUIDELINES}
      - Kafka__Consumers__Guidelines__Topic=${KAFKA_TOPICS_GUIDELINES}
      - Kafka__Consumers__Ontology__ConsumerGroup=${KAFKA_CONSUMER_GROUP_ONTOLOGY}
      - Kafka__Consumers__Ontology__Topic=${KAFKA_TOPICS_ONTOLOGY}
      - Minio__Address=${MINIO_ADDRESS}
      - Minio__AccessKey=${MINIO_ROOT_USER}
      - Minio__SecretKey=${MINIO_ROOT_PASSWORD}
      - Keycloak__ServerUrl=https://${KEYCLOAK_SERVER_HOSTNAME}
      - Keycloak__Realm=${KEYCLOAK_REALM}
      - Keycloak__ClientId=${KEYCLOAK_CLIENT_ID}
      - Keycloak__ClientSecret=${KEYCLOAK_CLIENT_SECRET}
      - Keycloak__Authority=https://${KEYCLOAK_SERVER_HOSTNAME}/realms/${KEYCLOAK_REALM}
      - OpenTelemetry__OtlpEndpoint=${OTLP_ENDPOINT}
    networks:
      - internal
      - gaeco-network
      - traefik-proxy
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/localhost/80 && echo -e 'GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'",
        ]
      interval: 10s
      timeout: 5s
      retries: 50
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-proxy"
      - "traefik.http.routers.${STACK_NAME}-server.rule=Host(`${INSTANCE_SERVER_HOSTNAME}`)"
      - "traefik.http.routers.${STACK_NAME}-server.entrypoints=https"
      - "traefik.http.routers.${STACK_NAME}-server.tls.certresolver=letsencrypt"
      - "traefik.http.services.${STACK_NAME}-server.loadbalancer.server.port=80"

  instance-client:
    image: ${IMAGE_BASE_PATH}/instance-client:${INSTANCE_CLIENT_TAG}
    expose:
      - 80
    environment:
      VITE_INSTANCE_SERVER_URL: https://${INSTANCE_SERVER_HOSTNAME}
      VITE_USECASE_SERVER_URL: https://${USECASE_SERVER_HOSTNAME}
      VITE_ONTOLOGY_SERVER_URL: https://${ONTOLOGY_SERVER_HOSTNAME}
      VITE_ACCESS_SERVER_URL: https://${ACCESS_SERVER_HOSTNAME}
      VITE_GUIDELINE_SERVER_URL: https://${GUIDELINE_SERVER_HOSTNAME}
      VITE_MOUNT_PATH: ${MOUNT_ROUTE}
    depends_on:
      instance-server:
        condition: service_healthy
    networks:
      - gaeco-network
    labels:
      "app.mfe.id": "app-instance"
      "app.mfe.displayName": "Instances"
      "app.mfe.description": "Instances Application"
      "app.mfe.iconPath": "/Instance.svg"
      "app.mfe.entrypointPath": "/assets/remoteEntry.js"
      "app.mfe.exposedModule": "App"
      "app.mfe.route": "${MOUNT_ROUTE}"

networks:
  internal:
  gaeco-network:
    name: ${ENVIRONMENT_NETWORK}
    external: true
  traefik-proxy:
    name: ${TRAEFIK_NETWORK}
    external: true
