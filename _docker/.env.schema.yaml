envSchema:
  # ---------------------------------------------------------------------------
  # Common
  # ---------------------------------------------------------------------------
  - name: IMAGE_BASE_PATH
    label: Image Registry Base Path
    description: "Base path of the container registry from which all Gaeco service images are pulled."
    type: text
    required: true
    default: ghcr.io/gaeco-ekkodale

  - name: ASPNETCORE_ENVIRONMENT
    label: ASP.NET Core Environment
    description: "Runtime environment for the .NET backend (e.g. Development, Staging, Production)."
    type: text
    required: true
    default: Development

  - name: OTLP_ENDPOINT
    label: OpenTelemetry OTLP Endpoint
    description: "Endpoint where telemetry data is exported."
    type: text
    required: true
    default: http://gaeco-monitor-aspire:18889

  # ---------------------------------------------------------------------------
  # External Service Hostnames
  # ---------------------------------------------------------------------------
  - name: KEYCLOAK_SERVER_HOSTNAME
    label: Keycloak Server Hostname
    description: "Hostname (and optional port) used to reach the Keycloak server. The protocol (https://) is prepended by the compose file."
    type: text
    required: true

  # ---------------------------------------------------------------------------
  # Authentication
  # ---------------------------------------------------------------------------
  - name: KEYCLOAK_REALM
    label: Keycloak Realm
    description: "Keycloak realm used for authentication."
    type: text
    required: true
    default: gaeco

  - name: KEYCLOAK_CLIENT_ID
    label: Keycloak Client ID
    description: "Keycloak realm client used by this module's backend (confidential, service account)."
    type: text
    required: true
    default: app-instance

  - name: KEYCLOAK_CLIENT_SECRET
    label: Keycloak Client Secret
    description: "Client secret of KEYCLOAK_CLIENT_ID, used by the backend service account."
    type: password
    required: true

  # ---------------------------------------------------------------------------
  # Kafka
  # ---------------------------------------------------------------------------
  - name: KAFKA_ADDRESS
    label: Kafka Address
    description: "Kafka bootstrap server address (network alias on gaeco-network). Shared by all consumers."
    type: text
    required: true
    default: gaeco-broker:29092

  - name: KAFKA_AUTO_OFFSET_RESET
    label: Kafka Auto Offset Reset
    description: "Broker-level consumer offset reset policy when no initial offset exists."
    type: text
    required: true
    default: Earliest

  - name: KAFKA_SESSION_TIMEOUT_MS
    label: Kafka Session Timeout (ms)
    description: "Broker-level timeout in milliseconds used to detect consumer failures."
    type: text
    required: true
    default: 150000

  - name: KAFKA_MAX_POLL_INTERVAL_MS
    label: Kafka Max Poll Interval (ms)
    description: "Broker-level maximum allowed delay between consumer poll calls in milliseconds."
    type: text
    required: true
    default: 1500000

  - name: KAFKA_MESSAGE_MAX_BYTES
    label: Kafka Max Message Size (bytes)
    description: "Broker-level maximum message size in bytes for producer and consumer. Must align with the broker's message.max.bytes."
    type: text
    required: true
    default: 52428800

  - name: KAFKA_CONSUMER_GROUP_GRAPHDATAMODEL
    label: Kafka Consumer Group (GraphDataModel)
    description: "Consumer group ID for the pattern-based GraphDataModel (gaecoImport) consumer."
    type: text
    required: true
    default: instance-service-group

  - name: KAFKA_TOPIC_PATTERN
    label: Kafka Topic Pattern (GraphDataModel)
    description: "Regex pattern matching the gaecoImport topics the GraphDataModel consumer subscribes to."
    type: text
    required: true
    default: "^.*\\..*\\..*\\.public\\..*\\.gaecoImport$"

  - name: KAFKA_CONSUMER_GROUP_GUIDELINES
    label: Kafka Consumer Group (Guidelines)
    description: "Consumer group ID for the Guidelines consumer."
    type: text
    required: true
    default: instance-service-guideline-group

  - name: KAFKA_TOPICS_GUIDELINES
    label: Kafka Topic (Guidelines)
    description: "Kafka topic for guideline upload events."
    type: text
    required: true
    default: ekkodale.gaeco.guideline.public.uploaded

  - name: KAFKA_CONSUMER_GROUP_ONTOLOGY
    label: Kafka Consumer Group (Ontology)
    description: "Consumer group ID for the Ontology consumer."
    type: text
    required: true
    default: instance-service-ontology-group

  - name: KAFKA_TOPICS_ONTOLOGY
    label: Kafka Topic (Ontology)
    description: "Kafka topic for ontology upload events."
    type: text
    required: true
    default: ekkodale.gaeco.ontology.public.uploaded

  # ---------------------------------------------------------------------------
  # Minio (Object Storage)
  # ---------------------------------------------------------------------------
  - name: MINIO_ADDRESS
    label: Minio Address
    description: "Address of the Minio instance (network alias on gaeco-network, e.g. gaeco-minio:9000)."
    type: text
    required: true
    default: gaeco-minio:9000

  - name: MINIO_ROOT_USER
    label: Minio Root User
    description: "Root user / access key for Minio."
    type: text
    required: true
    default: minioadmin

  - name: MINIO_ROOT_PASSWORD
    label: Minio Root Password
    description: "Root password / secret key for Minio."
    type: password
    required: true

  # ---------------------------------------------------------------------------
  # Instance Service
  # ---------------------------------------------------------------------------
  - name: INSTANCE_SERVER_HOSTNAME
    label: Instance Server Hostname
    description: "Hostname under which the Instance Service server is reachable (used for Traefik routing)."
    type: text
    required: true

  - name: INSTANCE_POSTGRES_USER
    label: Instance Postgres User
    description: "Database user for the Instance Service PostgreSQL instance."
    type: text
    required: true
    default: InstanceService

  - name: INSTANCE_POSTGRES_PASSWORD
    label: Instance Postgres Password
    description: "Database password for the Instance Service PostgreSQL instance."
    type: password
    required: true

  - name: INSTANCE_POSTGRES_DATABASE
    label: Instance Postgres Database
    description: "Database name for the Instance Service PostgreSQL instance."
    type: text
    required: true
    default: InstanceServiceDB

  - name: INSTANCE_ARCADEDB_USER
    label: Instance ArcadeDB User
    description: "Database user for the Instance Service ArcadeDB instance."
    type: text
    required: true
    default: InstanceService

  - name: INSTANCE_ARCADEDB_PASSWORD
    label: Instance ArcadeDB Password
    description: "Database password for the Instance Service ArcadeDB instance."
    type: password
    required: true

  - name: INSTANCE_ARCADEDB_DATABASE
    label: Instance ArcadeDB Database
    description: "Database name for the Instance Service ArcadeDB instance."
    type: text
    required: true
    default: InstanceServiceGremlin


  - name: USECASE_SERVER_HOSTNAME
    label: UseCase Server URL
    description: "Hostname (and optional port) used to reach the UseCase service API from the client. The protocol is prepended by the compose file."
    type: text
    required: true

  - name: ONTOLOGY_SERVER_HOSTNAME
    label: Ontology Server Hostname
    description: "Hostname (and optional port) used to reach the Ontology service API from the client. The protocol is prepended by the compose file."
    type: text
    required: true

  - name: ACCESS_SERVER_HOSTNAME
    label: Access Server Hostname
    description: "Hostname (and optional port) used to reach the Access service API from the client. The protocol is prepended by the compose file."
    type: text
    required: true

  - name: GUIDELINE_SERVER_HOSTNAME
    label: Guideline Server Hostname
    description: "Hostname (and optional port) used to reach the Guideline service API from the client. The protocol is prepended by the compose file."
    type: text
    required: true

  - name: MOUNT_ROUTE
    label: Mount Route
    description: "URL path at which the Instance micro-frontend is mounted in the shell (also used as VITE_MOUNT_PATH)."
    type: text
    required: true
    default: /instance

