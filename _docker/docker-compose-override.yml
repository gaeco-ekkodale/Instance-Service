# Local deltas on top of docker-compose.yml: published host ports, http/localhost URLs
# and build-from-source. Run locally:
#   docker compose -f docker-compose.yml -f docker-compose-override.yml up
# The packaged "-local" compose is generated from docker-compose.yml + this file
# (see build/Build.Release.CD.cs -> GenerateLocalComposeFile). The package keeps these
# build: sections; harmless, because the orchestrator pulls the image first and only
# falls back to build (which then no-ops on the missing context) if the pull fails.
name: instance-service
services:
  instance-postgres:
    ports:
      - ${INSTANCE_POSTGRES_OUTERPORT}:5432

  instance-arcadedb:
    ports:
      - ${INSTANCE_ARCADEDB_HTTP_OUTERPORT}:2480
      - ${INSTANCE_ARCADEDB_BINARY_OUTERPORT}:2424
      - ${INSTANCE_ARCADEDB_GREMLIN_OUTERPORT}:8182

  instance-server:
    ports:
      - "${INSTANCE_SERVER_OUTERPORT}:80"
    environment:
      - Keycloak__ServerUrl=http://keycloak-server:8080
      - Keycloak__Authority=http://${KEYCLOAK_SERVER_HOSTNAME}/realms/${KEYCLOAK_REALM}
    build:
      context: ../Server
      dockerfile: Api/Dockerfile
      secrets:
        - nugetconfig
  

  instance-client:
    ports:
      - "${INSTANCE_CLIENT_OUTERPORT}:80"
    environment:
      - VITE_INSTANCE_SERVER_URL=http://${INSTANCE_SERVER_HOSTNAME}
      - VITE_USECASE_SERVER_URL=http://${USECASE_SERVER_HOSTNAME}
      - VITE_ONTOLOGY_SERVER_URL=http://${ONTOLOGY_SERVER_HOSTNAME}
      - VITE_ACCESS_SERVER_URL=http://${ACCESS_SERVER_HOSTNAME}
      - VITE_GUIDELINE_SERVER_URL=http://${GUIDELINE_SERVER_HOSTNAME}
    build:
      context: ../Client
      dockerfile: _docker/Dockerfile

secrets:
  nugetconfig:
    file: ../../_docker/docker-compose-files/nuget.config
